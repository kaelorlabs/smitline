services:
  meeting-agent:
    image: smitline-meeting:local
    build:
      context: .
      dockerfile: Dockerfile.meeting
    # Run as the host user: runtime files are private (0700/0600) to that user,
    # and the host reads what the container records. start-meeting-agent.sh and
    # the runtime daemon set both values automatically.
    user: "${SMITLINE_UID:-1000}:${SMITLINE_GID:-1000}"
    env_file:
      - path: .env
      - path: .env.meeting
        required: false
      # A hosted deployment's account settings for one meeting (OpenAI key, voice, name),
      # written by the daemon just before the meeting starts; otherwise .env.meeting again.
      - path: ${SMITLINE_MEETING_ENV_FILE:-.env.meeting}
        required: false
    environment:
      HOME: /tmp
      SMITLINE_AUTH_MODE: ${SMITLINE_AUTH_MODE:-}
      SMITLINE_RUNTIME_STATE: ${SMITLINE_RUNTIME_STATE:-}
      # This meeting's own token: only the daemon that started it may listen in or write to it.
      SMITLINE_CONTROL_TOKEN: ${SMITLINE_CONTROL_TOKEN:-}
    shm_size: "2gb"
    ports:
      - "127.0.0.1:6082:6080"
      - "127.0.0.1:8094:8094"
    volumes:
      - ./meeting-runtime:/meeting-runtime:ro
      - ./joinly:/opt/joinly:ro
      - ./meeting-runtime/recordings:/meeting-runtime/recordings
      - ./meeting-runtime/profiles:/meeting-runtime/profiles
    stop_grace_period: 25s
