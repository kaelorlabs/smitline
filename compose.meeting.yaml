services:
  meeting-agent:
    image: meeting-agent-joinly-login:local
    build:
      context: .
      dockerfile: Dockerfile.login
    entrypoint: ["/app/.venv/bin/python", "-u", "/meeting-runtime/bridge.py"]
    env_file: [.env, .env.meeting]
    environment:
      COLLEAGUE_AUTH_MODE: ${COLLEAGUE_AUTH_MODE:-}
      COLLEAGUE_RUNTIME_STATE: ${COLLEAGUE_RUNTIME_STATE:-}
    shm_size: "2gb"
    ports:
      - "127.0.0.1:6082:6080"
      - "127.0.0.1:8094:8094"
    volumes:
      - ./meeting-runtime:/meeting-runtime:ro
      - ./meeting-runtime/jobs:/meeting-runtime/jobs
      - ./meeting-runtime/recordings:/meeting-runtime/recordings
      - ./meeting-runtime/profiles:/meeting-runtime/profiles
    stop_grace_period: 25s
