# Colleague AI MCP for Codex.
# join_current_meeting reads the real CODEX_THREAD_ID supplied by Codex and
# fails closed when it is unavailable. Restart Codex after installing.

[mcp_servers.colleague-ai]
command = "node"
args = ["/absolute/path/to/colleague-ai-private/packages/mcp/src/server.mjs"]
cwd = "/absolute/path/to/colleague-ai-private"
