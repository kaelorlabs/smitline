[build-system]
# 77 is the first release that reads an SPDX `license` expression (PEP 639).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "colleague-ai"
version = "1.0.0"
description = "Local Colleague AI SDK for joining Zoom, Teams, and Google Meet meetings through the runtime daemon."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["colleague_ai*"]
