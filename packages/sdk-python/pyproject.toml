[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "colleague-ai"
version = "1.0.0"
description = "Local Colleague AI SDK for joining Zoom, Teams, and Google Meet meetings through the runtime daemon."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["colleague_ai*"]
