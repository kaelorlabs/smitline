[build-system]
# 77 is the first release that reads an SPDX `license` expression (PEP 639).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "smitline"
version = "0.1.1"
description = "Local Smitline SDK for phone calls and Zoom, Teams, and Google Meet meetings through the runtime daemon."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/kaelorlabs/smitline"
Repository = "https://github.com/kaelorlabs/smitline"

[tool.setuptools.packages.find]
where = ["."]
include = ["smitline*"]
