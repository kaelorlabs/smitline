# Tests every pull request and every push to main. A version tag (v0.1.0, ...) also publishes
# the two images new users pull: ghcr.io/kaelorlabs/smitline and ghcr.io/kaelorlabs/smitline-meeting.
# To release: git tag v0.1.0 && git push origin v0.1.0
name: Images

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Python SDK tests
        run: cd packages/sdk-python && python3 -m unittest discover -s tests
      - uses: docker/setup-buildx-action@v3
      - name: Build the meeting image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.meeting
          load: true
          build-args: VERSION=test
          tags: smitline-meeting:test
          cache-from: type=gha,scope=meeting
          cache-to: type=gha,scope=meeting,mode=max
      - name: Runtime tests, inside the meeting image
        run: >
          docker run --rm --entrypoint /app/.venv/bin/python -w /meeting-runtime
          smitline-meeting:test -m unittest discover -s /meeting-runtime -p 'test_*.py'
      - name: Build the smitline image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          build-args: VERSION=test
          tags: smitline:test
          cache-from: type=gha,scope=smitline
          cache-to: type=gha,scope=smitline,mode=max
      - name: The smitline image starts and answers
        run: |
          docker volume create smitline-test
          docker run -d --name smitline-test --network host -v smitline-test:/data \
            -v /var/run/docker.sock:/var/run/docker.sock smitline:test
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8095/calls >/dev/null && break
            sleep 1
          done
          docker exec smitline-test smitline setup status --json | python3 -c 'import json,sys; json.load(sys.stdin)'
          curl -fsS -o /dev/null http://127.0.0.1:8095/calls
          docker logs smitline-test
          docker rm -f smitline-test

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Names and tags
        id: names
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "meeting=ghcr.io/$owner/smitline-meeting" >> "$GITHUB_OUTPUT"
          echo "smitline=ghcr.io/$owner/smitline" >> "$GITHUB_OUTPUT"
          echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          # v0.1.0 -> 0.1.0; anything that is not a version tag is named by its commit.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; else version="sha-${GITHUB_SHA::7}"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - id: meeting-tags
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.meeting }}
          tags: |
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Publish the meeting image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.meeting
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.names.outputs.version }}
          tags: ${{ steps.meeting-tags.outputs.tags }}
          labels: ${{ steps.meeting-tags.outputs.labels }}
          cache-from: type=gha,scope=meeting-publish
          cache-to: type=gha,scope=meeting-publish,mode=max
      - id: smitline-tags
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.smitline }}
          tags: |
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Publish the smitline image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # Each smitline image starts the meeting image built from the same commit.
          build-args: |
            MEETING_IMAGE=${{ steps.names.outputs.meeting }}:${{ steps.names.outputs.sha }}
            VERSION=${{ steps.names.outputs.version }}
          tags: ${{ steps.smitline-tags.outputs.tags }}
          labels: ${{ steps.smitline-tags.outputs.labels }}
          cache-from: type=gha,scope=smitline-publish
          cache-to: type=gha,scope=smitline-publish,mode=max

  # After the images are out, list this version in the official MCP Registry.
  mcp-registry:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/mcp-registry.yml
