# Publishes server.json to the official MCP Registry (registry.modelcontextprotocol.io) as
# io.github.kaelorlabs/smitline. Runs after a version tag's images are published (from
# images.yml), or by hand from the Actions tab. GitHub's OIDC token proves the run belongs to a
# kaelorlabs repository, so no one has to sign in and no secret is stored.
name: MCP Registry

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: server.json names a published image
        run: |
          version="$(jq -r .version server.json)"
          image="$(jq -r '.packages[] | select(.registryType == "oci") | .identifier' server.json)"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "server.json says $version but the tag is $GITHUB_REF_NAME; update server.json in the release PR" >&2
            exit 1
          fi
          docker manifest inspect "$image" > /dev/null
          echo "Publishing $version ($image)"
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --version
      - run: ./mcp-publisher validate
      - run: ./mcp-publisher login github-oidc
      # The registry sometimes times out (HTTP 504), sometimes after the version was saved; so
      # after a failure, stop if the version is listed, otherwise retry.
      - name: Publish
        run: |
          name="$(jq -r .name server.json)"
          version="$(jq -r .version server.json)"
          for attempt in 1 2 3 4; do
            if ./mcp-publisher publish; then exit 0; fi
            if curl -fsS "https://registry.modelcontextprotocol.io/v0/servers?search=$name" \
                | jq -e --arg v "$version" '.servers[] | select(.server.version == $v)' > /dev/null; then
              echo "$name $version is listed"
              exit 0
            fi
            echo "Attempt $attempt failed; retrying in $((attempt * 30)) s" >&2
            sleep $((attempt * 30))
          done
          exit 1
