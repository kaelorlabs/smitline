name: Feature request
description: Something Smitline should do that it does not.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The task or situation, not just the feature.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
