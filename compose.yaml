services:
  joinly:
    image: meeting-agent-joinly:local
    build:
      context: ./joinly
      dockerfile: docker/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    shm_size: "2gb"
    environment:
      JOINLY_BROWSER_PROFILE_DIR: /browser-data/profile
    command: ["--name", "Meeting Demo", "-v"]
    volumes:
      - ./demo:/demo
      - browser-data:/browser-data
      - ./joinly/joinly/providers/browser/browser_session.py:/app/.venv/lib/python3.12/site-packages/joinly/providers/browser/browser_session.py:ro
      - ./joinly/joinly/providers/browser/platforms/google_meet.py:/app/.venv/lib/python3.12/site-packages/joinly/providers/browser/platforms/google_meet.py:ro
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 4
  login:
    image: meeting-agent-joinly-login:local
    build:
      context: .
      dockerfile: Dockerfile.login
    profiles: ["login"]
    entrypoint: ["/app/.venv/bin/python", "/demo/login.py"]
    environment:
      JOINLY_BROWSER_PROFILE_DIR: /browser-data/profile
    ports:
      - "127.0.0.1:6081:6080"
    shm_size: "2gb"
    volumes:
      - ./demo:/demo:ro
      - browser-data:/browser-data
      - ./joinly/joinly/providers/browser/browser_session.py:/app/.venv/lib/python3.12/site-packages/joinly/providers/browser/browser_session.py:ro

  mock:
    image: meeting-agent-joinly-mock:local
    build:
      context: .
      dockerfile: Dockerfile.mock
    profiles: ["mock"]
    entrypoint: ["/app/.venv/bin/python", "/demo/mock.py"]
    ports:
      - "127.0.0.1:8090:8090"
    shm_size: "2gb"
    volumes:
      - ./demo:/demo
      - ./joinly:/source:ro

  live:
    image: meeting-agent-joinly:local
    profiles: ["live"]
    entrypoint: ["/app/.venv/bin/python", "/live/server.py"]
    ports:
      - "127.0.0.1:8092:8092"
    volumes:
      - ./live:/live

volumes:
  browser-data:
