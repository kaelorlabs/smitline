services:
  joinly:
    image: meeting-agent-joinly:local
    build:
      context: ./joinly
      dockerfile: docker/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    shm_size: "2gb"
    environment:
      JOINLY_BROWSER_PROFILE_DIR: /browser-data/profile
    command: ["--name", "Colleague AI", "-v"]
    volumes:
      - browser-data:/browser-data
      - ./joinly/joinly/providers/browser/browser_session.py:/app/.venv/lib/python3.12/site-packages/joinly/providers/browser/browser_session.py:ro
      - ./joinly/joinly/providers/browser/platforms/google_meet.py:/app/.venv/lib/python3.12/site-packages/joinly/providers/browser/platforms/google_meet.py:ro
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 4
volumes:
  browser-data:
