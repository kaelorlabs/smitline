# The meeting container when Smitline runs from its published image, one meeting at a time
# (SMITLINE_MAX_MEETINGS unset or 1), and the browser for signing the bot in to Teams or Google.
# The runtime starts it through the host's Docker (meeting_supervisor.py), as start-meeting-agent.sh
# does for a sign-in, with SMITLINE_MEETING_IMAGE, SMITLINE_ROOT, and SMITLINE_VOLUME set. Its code is
# in the image. Of the volume the smitline container keeps at /data, it mounts only the meetings'
# folders, as subpaths of the volume (Docker Engine 26 or later): never .env or .smitline/. From a
# checkout, compose.meeting.yaml is used.
name: smitline
services:
  meeting-agent:
    image: ${SMITLINE_MEETING_IMAGE:?set by the smitline image}
    user: "${SMITLINE_UID:-1001}:${SMITLINE_GID:-1001}"
    env_file:
      # Only what the meeting reads, written for this start just before it: its OpenAI key and
      # the meeting settings (meeting_line.single_meeting_environment). Never the installation's
      # settings files. A sign-in, and stopping or
      # listing the container, need none (/dev/null).
      - path: ${SMITLINE_MEETING_ENV_FILE:-/dev/null}
        required: false
    environment:
      HOME: /tmp
      SMITLINE_AUTH_MODE: ${SMITLINE_AUTH_MODE:-}
      SMITLINE_RUNTIME_STATE: ${SMITLINE_RUNTIME_STATE:-}
      # This meeting's own token: only the daemon that started it may listen in or write to it.
      SMITLINE_CONTROL_TOKEN: ${SMITLINE_CONTROL_TOKEN:-}
      # The meeting view's token for this start (meeting_view.py); without one the view stays shut.
      SMITLINE_VIEWER_TOKEN: ${SMITLINE_VIEWER_TOKEN:-}
    shm_size: "2gb"
    ports:
      - "127.0.0.1:6082:6080"
      - "127.0.0.1:8094:8094"
    volumes:
      # /meeting-runtime/run, recordings and profiles are links into /data/meetings. A meeting
      # reads its runtime state and writes its recording; a sign-in writes the browser profiles.
      - type: volume
        source: data
        target: /data/meetings/run
        read_only: true
        volume:
          subpath: meetings/run
      - type: volume
        source: data
        target: /data/meetings/recordings
        volume:
          subpath: meetings/recordings
      - type: volume
        source: data
        target: /data/meetings/profiles
        volume:
          subpath: meetings/profiles
    stop_grace_period: 25s
volumes:
  data:
    external: true
    name: ${SMITLINE_VOLUME:-smitline}
